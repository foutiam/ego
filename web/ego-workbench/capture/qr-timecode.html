<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ego · 采集时间码</title>
<style>
:root{color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;color:#e8f0f5;background:#101923;font:15px system-ui,sans-serif;text-align:center}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
main{
  --vh:100vh;--vh:100svh;
  --top:max(4px,env(safe-area-inset-top));--bottom:max(4px,env(safe-area-inset-bottom));
  --left:max(4px,env(safe-area-inset-left));--right:max(4px,env(safe-area-inset-right));
  --bar:40px;--gap:5px;--clock-info:23px;--board-info:30px;
  --view-width:calc(100vw - var(--left) - var(--right));
  --stage-height:calc(var(--vh) - var(--top) - var(--bottom) - var(--bar) - var(--gap));
  display:flex;flex-direction:column;gap:var(--gap);box-sizing:border-box;
  width:100%;min-height:var(--vh);margin:auto;padding:var(--top) var(--right) var(--bottom) var(--left);
}
.mode-buttons{display:flex;justify-content:center;gap:4px;flex:none;height:var(--bar)}
button{border:1px solid #436277;border-radius:7px;background:#203547;color:inherit;padding:4px 10px;font:inherit}
.mode-buttons button{flex:1;max-width:130px}
button[aria-pressed="true"]{border-color:#70ceb9;background:#224c44}
.screens{display:grid;justify-items:center;align-items:center;gap:var(--gap);min-height:var(--stage-height)}
#clockPanel{width:min(100%,calc(var(--stage-height) - var(--clock-info)))}
#qr{box-sizing:border-box;width:100%;aspect-ratio:1;padding:7%;background:white}
#qr[data-ready="false"] > *{visibility:hidden}
#qr canvas,#qr img,#qr svg{display:block;width:100%;height:auto;image-rendering:pixelated}
.clock-info{display:flex;align-items:center;justify-content:center;gap:5px;min-height:var(--clock-info)}
#status,#boardNote{color:#c4d2dc;font-size:12px;line-height:1.25;margin:2px 0}
#retry{font-size:12px;flex:none}
#boardPanel{width:100%;min-width:0}
#boardArt{height:calc(var(--stage-height) - var(--board-info));position:relative;overflow:hidden}
#boardImage{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#boardNote{box-sizing:border-box;min-height:var(--board-info);display:grid;place-content:center;margin:0}
@media (orientation:portrait){
  main[data-mode="board"] #boardImage{
    position:absolute;top:50%;left:50%;width:calc(var(--stage-height) - var(--board-info));height:var(--view-width);
    transform:translate(-50%,-50%) rotate(90deg);
  }
  main[data-mode="both"]{
    --art-height:calc(var(--stage-height) - var(--clock-info) - var(--board-info) - var(--gap));
    --board-height:min(calc(var(--view-width)*.66),calc(var(--art-height)*.42));
  }
  main[data-mode="both"] #clockPanel{width:min(100%,calc(var(--art-height) - var(--board-height)))}
  main[data-mode="both"] #boardArt{height:var(--board-height)}
}
@media (orientation:landscape){
  main[data-mode="both"] .screens{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
}
</style>
<script src="./qr-renderer.js" defer></script><script src="./qr-timecode.js?v=4" defer></script>
</head>
<body><main id="phoneDisplay" data-mode="qr">
<h1 class="sr-only">Ego · 采集时间码</h1>
<div class="mode-buttons" role="group" aria-label="手机屏幕内容">
<button type="button" data-display-mode="qr" aria-pressed="true">二维码</button>
<button type="button" data-display-mode="board" aria-pressed="false">标定板</button>
<button type="button" data-display-mode="both" aria-pressed="false">同时显示</button>
</div>
<div class="screens">
<section id="clockPanel" aria-label="二维码">
<div id="qr" aria-label="采集电脑时钟二维码"></div>
<span id="stamp" class="sr-only"></span>
<div class="clock-info"><p id="status" role="status">正在连接采集电脑时钟…</p>
<button type="button" id="retry" hidden>重新连接</button></div>
</section>
<section id="boardPanel" aria-label="标定板" hidden>
<div id="boardArt"><img id="boardImage" alt="8×5 ChArUco 标定板"></div>
<p id="boardNote">更换屏幕方向或显示模式后，请重新测量格长。</p>
</section>
</div>
</main></body></html>

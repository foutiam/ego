<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 · 片段输入 · Ego 交互数据工作台</title>
<link rel="stylesheet" href="/ego-capture/style.css">
<link rel="stylesheet" href="/workflow/workflow.css">
<script src="/ego-capture/review_event_view.js" defer></script>
<script src="/workflow/input-timeline.js" defer></script>
<script src="/workflow/input-events.js" defer></script>
<script src="/workflow/workflow.js" defer></script>
</head>
<body>
<nav class="capture-tools" aria-label="工作台">
  <a href="/ego-capture/">采集与处理</a>
  <a href="/workflow/" aria-current="page">物理交互工作流</a>
</nav>
<main>
  <ol class="nodes" aria-label="工作流节点">
    <li aria-current="step">01 · 片段输入</li>
    <li title="尚未发布">02 · 物体追踪</li><li title="尚未发布">03 · 骨架与手型</li>
    <li title="尚未发布">04 · 原动作物理还原</li><li title="尚未发布">05 · 目标手与重定向</li>
    <li title="尚未发布">06 · 仿真完善与演化</li><li title="尚未发布">07 · 目标物体配置</li>
    <li title="尚未发布">08 · 目标环境与初态</li>
  </ol>
  <section class="card input">
    <div class="toolbar">
      <label>片段 <select id="clip" disabled><option value="">正在读取</option></select></label>
      <button id="refresh" type="button" class="small">刷新</button>
      <a id="capture" href="/ego-capture/">登记片段</a>
    </div>
    <p id="status" role="status">正在读取</p>
    <div id="preview" hidden>
      <div class="input-media">
        <div class="previews">
          <figure><figcaption>CAM0 · 左眼</figcaption><img id="cam0" alt="CAM0 原始录制画面"></figure>
          <figure><figcaption>CAM1 · 右眼</figcaption><img id="cam1" alt="CAM1 原始录制画面"></figure>
        </div>
        <div class="input-transport">
          <button id="play" type="button">播放</button>
          <button id="prev" type="button" aria-label="上一帧">‹</button>
          <button id="next" type="button" aria-label="下一帧">›</button>
          <input id="frame" type="range" min="0" value="0" aria-label="片段预览帧">
          <output id="frameCount" for="frame"></output>
        </div>
        <p id="time" class="muted"></p>
        <section id="tactile" class="input-timeline" aria-labelledby="inputTactileTitle" hidden></section>
      </div>
      <aside id="events" class="input-events" aria-labelledby="pipelineInputEventTitle" hidden></aside>
    </div>
  </section>
</main>
</body>
</html>
